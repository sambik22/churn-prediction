name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt pytest httpx ruff
          pip install -e .
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Train end-to-end (smoke)
        run: python -m churn.train

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t churn-api .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name api churn-api
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d @scripts/example_customer.json
