[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "End-to-end прогноз відтоку клієнтів телеком-оператора: EDA, моделі, SHAP, FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "shap>=0.45",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "jupyter", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
